[package]
name = "bridge"
version = "0.5.0"
description = "ComplyEaze Bridge lets an AI assistant read from, and write to, the TallyPrime running on your own computer."
authors = ["AXAL"]
license = "Apache-2.0"
repository = "https://github.com/ComplyEaze/bridge"
publish = false
edition = "2021"
rust-version = "1.96"
default-run = "bridge"

[lints]
workspace = true

[features]
# Legacy voucher-scan outstandings path. Shipped/default builds take the
# native Bills Receivable/Payable + List of Ledgers path unconditionally;
# this gate exists so the ~4,800 lines of scan machinery (date/AlterID
# partitioning, segment completeness proofs, the wildcard voucher fetch) do
# not compile into a shipped build at all. Not a default feature.
voucher-scan = ["bridge-tally-protocol/voucher-scan", "bridge-tally-transport/voucher-scan"]
# Manual-only admission for the ignored, corpus-bound Unit A reconciliation
# harness. Shipped/default builds have no constructor for an AlterID width.
# The harness is what actually drives a voucher scan, so it implies the scan
# machinery it needs.
live-calibration-harness = ["voucher-scan"]
# LAB-ONLY additive surface for the audit-sprint 2026-09-14 local rebuild
# workflow (Phase 3). Not default; never enable in a release or CI workflow
# (`tests/lab_writes_ci_gate.rs` fails the build if any `.github/workflows/*`
# file does). Every tool this compiles in additionally refuses at runtime
# unless `BRIDGE_LAB_WRITES=1` is set, and further refuses unless
# `BRIDGE_TALLY_PORT=9001`, `BRIDGE_LAB_TARGET_GUID` and
# `BRIDGE_LAB_DENY_GUIDS` are all present and the observed loaded-company set
# matches them. Production write guards (`agent_import_post.rs`,
# `approved_import.rs`) are never touched by this feature; it is additive.
lab-writes = []

[workspace]
members = [
  ".",
  "crates/bridge-bank-statement",
  "crates/bridge-tally-core",
  "crates/bridge-tally-primitives",
  "crates/bridge-tally-protocol",
  "crates/bridge-tally-transport",
  "crates/bridge-tax-audit",
  "crates/tally-protocol-simulator",
]
resolver = "2"

# Repo has no automated code review any more, so this is the deterministic
# half of the replacement coverage. Every lint starts at `warn`, never `deny`:
# a `deny` here would turn a plain `cargo check`/`cargo build` from every
# contributor's editor into a hard failure the moment clippy's opinion changes
# out from under them, which is a much bigger blast radius than a CI gate. CI
# is free to escalate specific gates to `-D warnings` on its own (existing
# `cargo clippy -- -D warnings` steps already do, and inherit whatever is
# enabled here — see docs/proposed-ci-gates.md for the measured effect of
# adding this table on those existing steps).
#
# `pedantic` is the group `too_many_lines` (see src-tauri/clippy.toml) and the
# other findings-worthy lints in this analysis live in. It is enabled as a
# whole group, at `priority = -1`, so any lint inside it can still be
# dialled back individually below without the group re-asserting itself.
#
# Measured against this tree (2026-09-15, both workspaces): bare `pedantic`
# produced 2,399 warnings, and two lints alone were 1,154 of them —
# `missing_errors_doc` (770) and `must_use_candidate` (430). Both are pure
# API-documentation style opinions (every `Result`-returning public fn needs
# an `# Errors` doc section; every side-effect-free fn needs `#[must_use]`);
# neither maps to any of the five mechanically-catchable finding classes this
# lint table exists to cover, and together they would have buried the other
# 1,245 warnings under noise. They are turned back off, individually, at
# `priority = 1` so the override wins over the group. Every other pedantic
# lint is left at `warn` — see docs/proposed-ci-gates.md for the resulting
# count and its breakdown by lint.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = { level = "allow", priority = 1 }
must_use_candidate = { level = "allow", priority = 1 }

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[lib]
name = "bridge_lib"
crate-type = ["rlib"]

[[bin]]
name = "bridge"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
async-trait = "0.1"
bridge-bank-statement = { path = "crates/bridge-bank-statement" }
bridge-tally-core = { path = "crates/bridge-tally-core" }
bridge-tally-protocol = { path = "crates/bridge-tally-protocol" }
bridge-tally-transport = { path = "crates/bridge-tally-transport" }
chrono = { version = "0.4", features = ["serde"] }
getrandom = "0.4"
icu_properties = "2.3"
keyring = { version = "4.1.4", default-features = false, features = ["v1"] }
quick-xml = { version = "0.42", features = ["serialize"] }
# Bridge supports Windows and macOS; rfd's defaults add Linux portal/Wayland code.
rfd = { version = "0.17", default-features = false }
rust_xlsxwriter = { version = "0.99.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "chrono", "uuid"] }
tauri = { version = "2", features = [] }
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
zeroize = "1"
pdf-writer = "0.15.0"

[dev-dependencies]
reqwest = "0.13"
tally-protocol-simulator = { path = "crates/tally-protocol-simulator" }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(target_os = "macos"))'.dependencies]
libsqlite3-sys = { version = "0.37.0", features = ["bundled-sqlcipher-vendored-openssl"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
# On macOS, select SQLCipher's CommonCrypto provider rather than vendored
# OpenSSL. The observed CI teardown stack makes this a bounded provider change,
# not proof of the historical crash's sole cause.
libsqlite3-sys = { version = "0.37.0", features = ["bundled-sqlcipher"] }
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSResponder"] }
objc2-foundation = { version = "0.3.2", default-features = false }
