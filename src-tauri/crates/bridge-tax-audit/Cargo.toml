[package]
name = "bridge-tax-audit"
version = "0.1.0"
description = "Reads a tally-read-v1 directory into an audit book and runs books-based tax-audit tests (cash_44ab, cash_payments_40a3, depreciation, financial_statements, applicability_44ab) with canonical parity output"
license = "Apache-2.0"
repository = "https://github.com/lamemustafa/bridge"
publish = false
edition = "2021"
rust-version = "1.96"

[lints]
workspace = true

[dependencies]
bridge-tally-primitives = { path = "../bridge-tally-primitives" }
bridge-tally-protocol = { path = "../bridge-tally-protocol" }
flate2 = "1"
quick-xml = "0.42"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11"
thiserror = "2"
toml = "1.1"
unicode-normalization = "0.1"
